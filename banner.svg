<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/><stop offset="0.55" stop-color="#0d2530"/><stop offset="1" stop-color="#08171d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a96a2"/><stop offset="1" stop-color="#de6f38"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="258" rx="15" fill="none" stroke="#12323d" stroke-width="1"/>

  <g opacity="0.55" filter="url(#glow)">
    <path d="M -200 200 q 40 -34 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0"
          fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="160 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <line x1="40" y1="222" x2="960" y2="222" stroke="#1b4552" stroke-width="2" stroke-dasharray="10 8"/>
  <circle r="4.5" fill="#de6f38" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M 60 200 q 40 -34 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0"/>
  </circle>

  <text x="52" y="92" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="0.5">Yevhenii Basiuk</text>
  <text x="54" y="126" fill="#3fd0d8" font-size="21" font-weight="600" letter-spacing="3">CTO · VISIONIT</text>
  <text x="54" y="162" fill="#9fb2bd" font-size="17">Railway telemetry &amp; fleet systems — from the edge on the train to the operator’s dashboard.</text>
  <rect x="54" y="176" width="150" height="3" rx="2" fill="url(#accent)"/>

  <g text-anchor="middle" font-size="13.5" font-weight="700">
    <g transform="translate(590,205)"><circle r="19" fill="#0e2d38" stroke="#0a96a2" stroke-width="1.5"/><circle r="19" fill="none" stroke="#0a96a2" stroke-width="1.5" opacity="0.6"><animate attributeName="r" values="19;26;19" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(679,205)"><circle r="19" fill="#0e2d38" stroke="#0a96a2" stroke-width="1.5"/><circle r="19" fill="none" stroke="#0a96a2" stroke-width="1.5" opacity="0.6"><animate attributeName="r" values="19;26;19" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(768,205)"><circle r="19" fill="#0e2d38" stroke="#0a96a2" stroke-width="1.5"/><circle r="19" fill="none" stroke="#0a96a2" stroke-width="1.5" opacity="0.6"><animate attributeName="r" values="19;26;19" dur="3s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(857,205)"><circle r="19" fill="#0e2d38" stroke="#de6f38" stroke-width="1.5"/><circle r="19" fill="none" stroke="#de6f38" stroke-width="1.5" opacity="0.6"><animate attributeName="r" values="19;26;19" dur="3s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(946,205)"><circle r="19" fill="#0e2d38" stroke="#de6f38" stroke-width="1.5"/><circle r="19" fill="none" stroke="#de6f38" stroke-width="1.5" opacity="0.6"><animate attributeName="r" values="19;26;19" dur="3s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>
